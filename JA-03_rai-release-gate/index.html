<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsible AI Release Gate</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></div>
    <div><div class="brand-title">Release Gate</div><div class="brand-sub">JA-03 · Responsible AI testing</div></div>
  </div>
  <nav class="stepper" id="stepper" aria-label="Workflow steps"></nav>
  <div class="spacer"></div>
  <div class="tools">
    <div class="sel" data-tip="Who is using the tool. Approvals check this."><label for="persona">Viewing as</label><select id="persona"></select></div>
    <button class="btn" id="btnChecks" data-tip="Known-answer checks, run live against the engine.">Checks <span class="badge" id="checkCount">–</span></button>
    <button class="btn" id="btnLog" data-tip="Every step, approval and decision, with who did it.">Log <span class="badge" id="logCount">0</span></button>
    <button class="btn icon" id="btnPresenter" data-tip="Presenter mode: larger type (P)."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button class="btn" id="btnReset" data-tip="Start over: clears the build, test set, runs, tickets and the log.">Reset</button>
  </div>
</header>

<main>
  <section class="view" id="view-1"></section>
  <section class="view" id="view-2"></section>
  <section class="view" id="view-3"></section>
  <section class="view" id="view-4"></section>
  <section class="view" id="view-5"></section>
  <section class="view" id="view-6"></section>
  <div id="print-report"></div>
</main>

<aside class="drawer" id="drawer" aria-label="Details">
  <div class="drawer-h"><div style="flex:1" id="drawerHead"></div><button class="btn sm" id="drawerClose">Close</button></div>
  <div class="drawer-b" id="drawerBody"></div>
</aside>
<div class="overlay" id="overlay" role="dialog"><div class="card modal" id="modal"></div></div>
<div class="card panel" id="logPanel"><div class="card-h">Activity log<span class="spacer"></span><button class="btn sm" data-close="logPanel">Close</button></div><div class="scroll" id="logList"></div></div>
<div class="card panel" id="checkPanel"><div class="card-h">Known-answer checks<span class="spacer"></span><button class="btn sm" id="rerunChecks">Run again</button><button class="btn sm" data-close="checkPanel">Close</button></div><div class="scroll" id="checkList"></div></div>
<input type="file" id="pickFolder" webkitdirectory multiple class="hidden">
<input type="file" id="pickZip" accept=".zip" class="hidden">
<input type="file" id="pickResults" accept=".jsonl,.json,.txt" class="hidden">
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<footer>For demo purposes only. All data is fictional and does not represent any organization. · Built by Aby Rao</footer>

<script src="js/vendor/jszip.min.js"></script>
<script src="js/samples.js"></script>
<script src="js/scan.js"></script>
<script src="js/generate.js"></script>
<script src="js/evaluate.js"></script>
<script src="js/app.js"></script>
</body>
</html>
