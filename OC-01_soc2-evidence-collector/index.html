<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOC 2 Evidence Collector · OC-01</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="badge mono">OC-01</span>
      <span class="brand-name">Evidence Collector</span>
      <span class="pill mono" data-tip="Audit period Oct 1, 2025 – Sep 30, 2026 · external auditor: Brightline Assurance (fictional)">SOC 2 Type II · FY2026</span>
    </div>
    <nav class="seg" role="tablist" aria-label="Views">
      <span class="seg-ind" aria-hidden="true"></span>
      <button class="seg-btn on" data-view="overview" role="tab" data-tip="Shortcut: 1">Overview</button>
      <button class="seg-btn" data-view="controls" role="tab" data-tip="Shortcut: 2">Controls</button>
      <button class="seg-btn" data-view="evidence" role="tab" data-tip="Shortcut: 3">Evidence</button>
      <button class="seg-btn" data-view="report" role="tab" data-tip="Shortcut: 4">Report</button>
    </nav>
    <div class="tools">
      <button id="aboutBtn" class="tool" data-tip="Checks, guardrails, and the AI off switch">About</button>
      <button id="logBtn" class="tool" data-tip="Every action taken in this session">Log</button>
      <button id="presenterBtn" class="tool" aria-pressed="false" data-tip="Larger view for the room (hides About and Log)">Present</button>
      <button id="resetBtn" class="tool" data-tip="Restore the starting data">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="head">
      <h1 id="question">Are we on track for fieldwork?</h1>
      <p id="subhead" class="subhead"></p>
    </section>
    <section id="view" class="view"></section>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <button class="tool close" data-close="drawer">Close</button>
    <div id="drawerBody"></div>
  </aside>

  <aside id="about" class="drawer" aria-hidden="true">
    <button class="tool close" data-close="about">Close</button>
    <div id="aboutBody"></div>
  </aside>

  <aside id="log" class="log card" aria-hidden="true">
    <div class="eyebrow">Activity log</div>
    <ol id="logList"></ol>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>

  <footer class="foot mono">
    For demo purposes only. All data is fictional and does not represent any organization. · Built by Aby Rao
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
