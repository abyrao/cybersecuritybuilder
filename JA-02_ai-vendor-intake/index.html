<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Vendor Intake · JA-02</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="badge mono">JA-02</span>
      <span class="brand-name">AI Vendor Intake</span>
    </div>
    <div id="vendorPill" class="vendor-pill"></div>
    <div class="tools">
      <label class="persona" data-tip="Switch people to see who can resolve conflicts and decide">
        <span class="lbl">Viewing as</span>
        <select id="persona" aria-label="Viewing as"></select>
      </label>
      <button id="registerBtn" class="tool" data-tip="Every approved AI vendor and when it's due for review">Register</button>
      <button id="checksBtn" class="tool" data-tip="Known-answer checks and guardrails">Checks</button>
      <button id="logBtn" class="tool" data-tip="Every action in this session">Log</button>
      <button id="presenterBtn" class="tool" aria-pressed="false" data-tip="Larger view for the room">Present</button>
      <button id="resetBtn" class="tool" data-tip="Start over with the starting data">Reset</button>
    </div>
  </header>

  <div id="shell" class="shell nometer">
    <nav id="rail" class="rail" aria-label="Intake steps"></nav>
    <main id="view" class="view"></main>
    <aside id="meter" class="card meter" aria-live="polite"></aside>
  </div>

  <aside id="checks" class="drawer" aria-hidden="true">
    <button class="tool close" data-close="checks">Close</button>
    <div id="checksBody"></div>
  </aside>

  <aside id="log" class="log card" aria-hidden="true">
    <div class="eyebrow">Activity log</div>
    <ol id="logList"></ol>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>

  <footer class="foot mono">
    For demo purposes only. All data is fictional and does not represent any organization. · Built by Aby Rao
  </footer>

  <script src="js/data.js"></script>
  <script src="js/recon.js"></script>
  <script src="js/score.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
