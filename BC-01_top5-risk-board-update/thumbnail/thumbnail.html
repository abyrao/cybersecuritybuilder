<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BC-01 thumbnail</title>
<style>
@font-face { font-family: "Plus Jakarta Sans"; font-weight: 500; src: url("../assets/fonts/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plus Jakarta Sans"; font-weight: 700; src: url("../assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Plus Jakarta Sans"; font-weight: 800; src: url("../assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
html, body { margin: 0; }
.card { width: 1280px; height: 720px; position: relative; overflow: hidden; color: #E3F1FB; font-family: "Plus Jakarta Sans", sans-serif;
  background: #071A2B; background-image: radial-gradient(800px 500px at 90% 0%, rgba(79,209,197,.18), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(255,181,71,.12), transparent 60%); }
.top { position: absolute; left: 64px; top: 52px; display: flex; gap: 12px; align-items: center; }
.badge { background: #FFB547; color: #241400; font: 500 18px "IBM Plex Mono", monospace; padding: 5px 12px; border-radius: 9px; }
.eyebrow { font: 500 17px "IBM Plex Mono", monospace; letter-spacing: .12em; color: #8FA9BF; }
.title { position: absolute; left: 64px; top: 140px; width: 560px; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -.035em; }
.title em { font-style: normal; color: #FFB547; }
.sub { position: absolute; left: 64px; top: 400px; width: 500px; font-weight: 500; font-size: 25px; line-height: 1.4; color: #8FA9BF; }
.seg { position: absolute; left: 64px; top: 528px; display: inline-flex; gap: 4px; padding: 5px; border: 1px solid rgba(227,241,251,.18); border-radius: 16px; }
.seg span { padding: 9px 16px; border-radius: 11px; font-weight: 700; font-size: 17px; color: #8FA9BF; }
.seg span.on { background: #FFB547; color: #241400; }
.panel { position: absolute; right: 56px; top: 110px; width: 600px; height: 480px; border-radius: 22px; border: 1px solid rgba(227,241,251,.1);
  background: linear-gradient(180deg, rgba(19,53,83,.8), rgba(14,42,66,.8)); }
.panel svg { position: absolute; left: 0; top: 0; }
.foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 64px; display: flex; justify-content: space-between;
  font: 400 15px "IBM Plex Mono", monospace; color: #8FA9BF; border-top: 1px solid rgba(227,241,251,.1); background: rgba(4,16,27,.6); }
.foot b { color: #FFB547; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="badge">BC-01</span><span class="eyebrow">CYBERSECURITY BUILDER</span></div>
  <div class="title">Top 5 cyber risks, <em>every quarter.</em></div>
  <div class="sub">One board view: this quarter, last year, and five years of change.</div>
  <div class="seg"><span class="on">This quarter</span><span>Last year</span><span>5 years</span></div>
  <div class="panel"><svg id="chart" width="600" height="480" viewBox="0 0 600 480"></svg></div>
  <div class="foot"><span><b>Built by Aby Rao</b> · github.com/abyrao/cybersecuritybuilder</span><span>Demo only · fictional data</span></div>
</div>
<script src="../js/data.js"></script>
<script>
(function () {
  const D = window.BC01, NS = "http://www.w3.org/2000/svg", svg = document.getElementById("chart");
  const mk = (t, a, txt) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (txt) n.textContent = txt; svg.appendChild(n); return n; };
  const xa = 56, xb = 452, ya = 70, rowH = 50;
  const X = i => xa + (xb - xa) * i / (D.QUARTERS - 1), Y = r => ya + (r - 1) * rowH;
  mk("text", { x: xa - 10, y: 36, "font-family": "IBM Plex Mono", "font-size": 13, fill: "#8FA9BF" }, "RANK · " + D.quarterLabel(0) + " → " + D.quarterLabel(D.CURRENT));
  mk("rect", { x: xa - 14, y: Y(1) - 20, width: xb - xa + 28, height: rowH * 5 - 8, rx: 12, fill: "rgba(255,181,71,.07)", stroke: "rgba(255,181,71,.25)" });
  const now = D.topFive(D.CURRENT).map(r => r.id);
  D.RISKS.slice().sort((a, b) => (a.id === "ai") - (b.id === "ai") || now.includes(a.id) - now.includes(b.id)).forEach(r => {
    const pts = []; for (let i = 0; i < D.QUARTERS; i++) pts.push(X(i) + "," + Y(D.RANKS[i][r.id]));
    const ai = r.id === "ai", strong = now.includes(r.id);
    mk("polyline", { points: pts.join(" "), fill: "none", stroke: r.color, "stroke-width": ai ? 8 : strong ? 4 : 2.5,
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: ai ? 1 : strong ? .9 : .5 });
  });
  const yAi = Y(D.RANKS[D.CURRENT].ai);
  mk("circle", { cx: X(D.CURRENT), cy: yAi, r: 12, fill: "#FFB547" });
  mk("circle", { cx: X(D.CURRENT), cy: yAi, r: 22, fill: "none", stroke: "#FFB547", "stroke-opacity": .35, "stroke-width": 2 });
  mk("text", { x: X(D.CURRENT) + 32, y: yAi + 8, "font-family": "Plus Jakarta Sans", "font-weight": 800, "font-size": 26, fill: "#FFB547" }, "#1 AI");
  mk("text", { x: X(D.CURRENT) + 32, y: yAi + 32, "font-family": "Plus Jakarta Sans", "font-weight": 700, "font-size": 18, fill: "#E3F1FB" }, "security");
  mk("text", { x: X(0) - 10, y: Y(8) + 6, "text-anchor": "end", "font-family": "IBM Plex Mono", "font-size": 13, fill: "#FFB547" }, "#8");
})();
</script>
</body>
</html>
