<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top 5 Risk Board Update · BC-01</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="thread" aria-hidden="true"></div>

  <header class="top">
    <div class="meta mono">
      <span>BC-01</span><span class="dot">·</span><span id="quarterNow">Q3 2026</span><span class="dot">·</span><span>Board of directors</span>
    </div>
    <div class="controls">
      <button id="aboutBtn" class="ghost mono">About this build</button>
      <button id="logBtn" class="ghost mono">Activity log</button>
      <button id="presenterBtn" class="ghost mono" aria-pressed="false">Presenter mode</button>
      <button id="resetBtn" class="ghost mono">Reset demo</button>
    </div>
  </header>

  <main>
    <h1 id="question">What are our top five cyber risks this quarter?</h1>

    <nav class="views" role="tablist" aria-label="Time period">
      <button class="view on" data-view="now" role="tab">This quarter</button>
      <button class="view" data-view="lastq" role="tab">vs last quarter</button>
      <button class="view" data-view="lasty" role="tab">vs last year</button>
      <button class="view" data-view="five" role="tab">Five-year story</button>
    </nav>

    <section id="stage" class="stage" aria-live="polite"></section>

    <aside id="summary" class="summary">
      <div class="summary-head mono"><span>What changed and why</span><span class="tag">simulated AI</span></div>
      <p id="summaryText"></p>
    </aside>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <button class="close ghost mono" data-close="drawer">Close</button>
    <div id="drawerBody"></div>
  </aside>

  <aside id="about" class="drawer" aria-hidden="true">
    <button class="close ghost mono" data-close="about">Close</button>
    <div id="aboutBody"></div>
  </aside>

  <aside id="log" class="log" aria-hidden="true">
    <div class="mono log-head">Activity log</div>
    <ol id="logList"></ol>
  </aside>

  <footer class="foot mono">
    For demo purposes only. All data is fictional and does not represent any organization. · Built by Aby Rao
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
