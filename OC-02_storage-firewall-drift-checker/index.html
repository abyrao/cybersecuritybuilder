<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift Checker · OC-02</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="badge">OC-02</span>
      <span class="brand-name">Drift Checker</span>
    </div>
    <nav class="seg" role="tablist" aria-label="Views">
      <span class="seg-ind" aria-hidden="true"></span>
      <button class="seg-btn on" data-view="baseline" role="tab" data-tip="What does good look like? · 1">Baseline</button>
      <button class="seg-btn" data-view="inventory" role="tab" data-tip="What do we have? · 2">Inventory</button>
      <button class="seg-btn" data-view="drift" role="tab" data-tip="Where have we drifted? · 3">Drift</button>
      <button class="seg-btn" data-view="exposure" role="tab" data-tip="What's open, and how widely? · 4">Exposure</button>
      <button class="seg-btn" data-view="prioritize" role="tab" data-tip="What do we fix first? · 5">Prioritize</button>
      <button class="seg-btn" data-view="report" role="tab" data-tip="How are we doing? · 6">Report</button>
    </nav>
    <div class="tools">
      <label class="persona" data-tip="Switch people to see who can fix, approve auto-fixes, and grant exceptions">
        <span class="lbl">Viewing as</span>
        <select id="persona" aria-label="Viewing as"></select>
      </label>
      <button id="checksBtn" class="tool" data-tip="Known-answer checks and guardrails">Checks</button>
      <button id="logBtn" class="tool" data-tip="Every action in this session">Log</button>
      <button id="presenterBtn" class="tool" aria-pressed="false" data-tip="Larger view for the room">Present</button>
      <button id="resetBtn" class="tool" data-tip="Restore the starting data">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section id="view" class="view"></section>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <button class="tool close" data-close="drawer">Close</button>
    <div id="drawerBody"></div>
  </aside>

  <aside id="log" class="log card" aria-hidden="true">
    <div class="eyebrow">Activity log</div>
    <ol id="logList"></ol>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>

  <footer class="foot">
    For demo purposes only. All data is fictional and does not represent any organization. · Built by Aby Rao
  </footer>

  <script src="js/baseline.js"></script>
  <script src="js/estate.js"></script>
  <script src="js/drift.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/remediate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
